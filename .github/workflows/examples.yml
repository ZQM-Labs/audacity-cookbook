name: Example contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - name: Generate example WAV
        run: python examples/01-first-sfx/generate.py --output build/soft-pulse.wav
      - name: Check WAV output exists
        run: test -s build/soft-pulse.wav
